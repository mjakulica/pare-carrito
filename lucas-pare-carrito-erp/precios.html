<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light only" />
<title>Lista de precios — Pare Carrito</title>
<link rel="icon" type="image/png" href="./assets/favicon.png?v=20260723-sync" />
<style>
  :root{ --green:#176b49; --green2:#115c3e; --blue:#2457a6; --line:#e2e2e6; --ink:#16281f; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; }
  body{ font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--ink); background:#f4f7f5; }
  header{ background:linear-gradient(180deg,var(--green),var(--green2)); color:#eaf6f0; padding:16px 14px; }
  .brand{ display:flex; align-items:center; gap:12px; max-width:960px; margin:0 auto; }
  .brand img{ width:40px; height:40px; border-radius:8px; background:#fff; padding:3px; }
  .brand h1{ font-size:19px; margin:0; }
  .brand small{ opacity:.85; font-size:12px; }
  .wrap{ max-width:960px; margin:0 auto; padding:0 12px 40px; }
  /* Gate */
  .gate{ min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; padding:20px; }
  .gate h2{ margin:0; font-size:22px; color:var(--green); }
  .gate p{ margin:0; color:#5a6b62; }
  .gate-btns{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px; }
  .gate-btns button{ font-size:18px; font-weight:700; padding:18px; border-radius:14px; border:2px solid var(--green); cursor:pointer; }
  .gate-btns .sin{ background:#fff; color:var(--green); }
  .gate-btns .con{ background:var(--green); color:#fff; }
  .ivanote{ font-size:12px; color:#5a6b62; }
  /* App */
  #app{ display:none; }
  .toolbar{ position:sticky; top:0; z-index:6; background:#f4f7f5; padding:10px 0 6px; }
  .row1{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .search{ flex:1 1 200px; min-width:0; }
  .search input{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  .seg{ display:inline-flex; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  .seg button{ padding:10px 12px; border:0; background:#fff; color:#33413a; font-weight:700; cursor:pointer; font-size:13px; }
  .seg button.active{ color:#fff; }
  .seg.iva button.active{ background:var(--green); }
  .seg.who button.active{ background:var(--blue); }
  .seg.view button.active{ background:#33413a; }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .chip{ padding:7px 11px; border-radius:999px; border:1px solid var(--line); background:#fff; color:#33413a; font-size:13px; font-weight:600; cursor:pointer; }
  .chip.active{ background:var(--green); color:#fff; border-color:var(--green); }
  .chip.all.active{ background:#33413a; border-color:#33413a; }
  .meta{ font-size:12px; color:#5a6b62; margin:8px 0; }
  /* Grid */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .card{ background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); padding:10px; display:flex; flex-direction:column; gap:8px; }
  .card .top{ display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .card .name{ font-weight:700; font-size:14px; line-height:1.2; }
  .card .unit{ color:#7a8a82; font-weight:600; font-size:11px; }
  .thumb{ width:46px; height:46px; border-radius:8px; flex:0 0 auto; object-fit:cover; background:#eef2f0; }
  .lprod{ display:flex; align-items:center; gap:10px; }
  .lthumb{ width:34px; height:34px; border-radius:7px; flex:0 0 auto; object-fit:cover; background:#eef2f0; }
  .card .price{ font-size:18px; font-weight:800; color:var(--green); }
  .card .brk{ font-size:11px; color:#7a8a82; }
  .tag{ display:inline-block; font-size:10px; font-weight:700; padding:2px 6px; border-radius:6px; }
  .tag.may{ background:#e7effb; color:var(--blue); }
  .tag.men{ background:#eaf6f0; color:var(--green); }
  /* List */
  table{ width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); }
  th{ background:#eaf6f0; color:var(--green); font-size:13px; }
  td.price{ text-align:right; font-weight:800; white-space:nowrap; color:var(--green); }
  td .brk{ font-weight:400; color:#7a8a82; font-size:11px; }
  tr:last-child td{ border-bottom:0; }
  .catrow td{ background:#f0f5f2; font-weight:800; color:var(--green); font-size:13px; }
  .empty{ text-align:center; padding:30px; color:#7a8a82; }
  .foot{ text-align:center; color:#8a9992; font-size:12px; margin-top:16px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="./assets/logo.png?v=20260723-sync" alt="Pare Carrito" onerror="this.style.display='none'" />
    <div><h1>Pare Carrito</h1><small>Insumos frescos para gastronómicos</small></div>
  </div>
</header>

<div class="wrap">
  <div class="gate" id="gate">
    <h2>Lista de precios</h2>
    <p>¿Cómo querés ver los precios?</p>
    <div class="gate-btns">
      <button class="sin" data-mode="sin">Ver precios SIN IVA</button>
      <button class="con" data-mode="con">Ver precios CON IVA</button>
    </div>
  </div>

  <div id="app">
    <div class="toolbar">
      <div class="row1">
        <div class="search"><input id="q" type="search" placeholder="Buscar producto..." autocomplete="off" /></div>
        <div class="seg who">
          <button data-who="mayor">Por Mayor</button>
          <button data-who="menor">Por Menor</button>
        </div>
        <div class="seg view">
          <button data-view="grid">Cuadrícula</button>
          <button data-view="list">Lista</button>
        </div>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="meta" id="meta"></div>
    <div id="list"></div>
    <div class="foot">Los precios se actualizan automáticamente. www.parecarrito.com.ar</div>
  </div>
</div>

<script>
(function(){
  var API = "/api/public/price-list";
  var st = { items:[], categories:[], updatedAt:null, mode:"sin", who:{mayor:true,menor:true}, view:"grid", q:"", selCats:null };

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  // <img> con la imagen real del producto y fallback al placeholder de color si no carga.
  function imgTag(it, cls){
    var ph = thumb(it);
    var src = it.image || ph;
    return '<img class="'+cls+'" loading="lazy" src="'+esc(src)+'" data-fb="'+esc(ph)+'" onerror="this.onerror=null;this.src=this.dataset.fb" alt="" />';
  }
  function fmt(n){ return "$" + Math.round(Number(n||0)).toLocaleString("es-AR"); }
  function fmtDate(iso){ if(!iso) return ""; try{ var d=new Date(iso); return d.toLocaleDateString("es-AR")+" "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
  // Fecha de ultima actualizacion del precio por producto (dd/mm/aaaa). Si no hay, usa hoy,
  // igual que la lista de precios del rol cliente.
  function fmtDay(iso){
    if(!iso) return "—";
    var p=String(iso).slice(0,10).split("-");
    var d = p.length===3 ? new Date(+p[0],+p[1]-1,+p[2]) : new Date(iso);
    if(isNaN(d.getTime())) return "—";
    return d.toLocaleDateString("es-AR");
  }
  function net(it){ return it.price; }
  function con(it){ return it.price * (1 + (Number(it.ivaSurcharge)||0)/100); }
  function shown(it){ return st.mode==="con" ? con(it) : net(it); }

  var CAT_COLORS = { FRUTAS:["#ffefd2","#ba5c00"], VERDURAS:["#e6f4ef","#0f7a5d"], HUEVOS:["#fff2d8","#a36300"], OTROS:["#e9f0fb","#2457a6"] };
  function thumb(it){
    var c = CAT_COLORS[it.category] || ["#edf0f4","#475569"];
    var lbl = esc(String(it.name||"?").slice(0,2).toUpperCase());
    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="8" fill="'+c[0]+'"/><text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="'+c[1]+'">'+lbl+'</text></svg>');
  }

  function filtered(){
    var q = st.q.trim().toLowerCase();
    return st.items.filter(function(it){
      if(q && it.name.toLowerCase().indexOf(q)===-1) return false;
      if(it.wholesale && !st.who.mayor) return false;
      if(!it.wholesale && !st.who.menor) return false;
      if(st.selCats && !st.selCats[it.category]) return false;
      return true;
    });
  }

  function renderChips(){
    var box = document.getElementById("chips");
    var allOn = st.categories.every(function(c){ return st.selCats[c]; });
    var html = '<span class="chip all '+(allOn?"active":"")+'" data-cat="__all">Todos</span>';
    html += st.categories.map(function(c){ return '<span class="chip '+(st.selCats[c]?"active":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</span>'; }).join("");
    box.innerHTML = html;
    box.querySelectorAll(".chip").forEach(function(ch){
      ch.addEventListener("click", function(){
        var c = ch.dataset.cat;
        if(c==="__all"){ var turnOn = !st.categories.every(function(x){return st.selCats[x];}); st.categories.forEach(function(x){ st.selCats[x]=turnOn; }); }
        else { st.selCats[c] = !st.selCats[c]; }
        renderChips(); renderList();
      });
    });
  }

  function priceCell(it){
    var upd = '<div class="brk upd">Últ. act: '+fmtDay(it.date)+'</div>';
    return '<div class="price">'+fmt(shown(it))+'</div>'+upd;
  }

  function renderList(){
    var items = filtered();
    document.querySelectorAll(".seg.who button").forEach(function(b){ b.classList.toggle("active", !!st.who[b.dataset.who]); });
    document.querySelectorAll(".seg.view button").forEach(function(b){ b.classList.toggle("active", b.dataset.view===st.view); });
    document.getElementById("meta").textContent = (st.mode==="con"?"Precios CON IVA":"Precios SIN IVA") + " · " + items.length + " productos" + (st.updatedAt?" · actualizado "+fmtDate(st.updatedAt):"");
    var box = document.getElementById("list");
    if(!items.length){ box.innerHTML = '<div class="empty">No hay productos para esta selección.</div>'; return; }

    if(st.view==="grid"){
      box.innerHTML = '<div class="grid">'+items.map(function(it){
        var tag = it.wholesale ? '<span class="tag may">Mayor</span>' : '<span class="tag men">Menor</span>';
        return '<div class="card"><div class="top"><div><div class="name">'+esc(it.name)+'</div><div class="unit">'+esc(it.unitType||"")+' '+tag+'</div></div>'+
               imgTag(it,"thumb")+'</div>'+priceCell(it)+'</div>';
      }).join("")+'</div>';
      return;
    }
    // lista, agrupada por categoria
    var rows=""; var lastCat=null;
    items.forEach(function(it){
      if(it.category!==lastCat){ rows += '<tr class="catrow"><td colspan="2">'+esc(it.category)+'</td></tr>'; lastCat=it.category; }
      var tag = it.wholesale ? '<span class="tag may">Mayor</span>' : '<span class="tag men">Menor</span>';
      rows += '<tr><td><div class="lprod">'+imgTag(it,"lthumb")+'<span>'+esc(it.name)+' <span class="unit">('+esc(it.unitType||"")+')</span> '+tag+'</span></div></td><td class="price">'+fmt(shown(it))+'<br><span class="brk upd">Últ. act: '+fmtDay(it.date)+'</span></td></tr>';
    });
    box.innerHTML = '<table><thead><tr><th>Producto</th><th style="text-align:right">Precio</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }

  function showApp(){ document.getElementById("gate").style.display="none"; document.getElementById("app").style.display="block"; }

  function load(){
    fetch(API,{cache:"no-store"}).then(function(r){return r.json();}).then(function(data){
      st.items = Array.isArray(data.items)?data.items:[];
      st.categories = Array.isArray(data.categories)&&data.categories.length ? data.categories : Array.from(new Set(st.items.map(function(i){return i.category;})));
      st.updatedAt = data.updatedAt||null;
      if(!st.selCats){ st.selCats={}; st.categories.forEach(function(c){ st.selCats[c]=true; }); }
      else { st.categories.forEach(function(c){ if(!(c in st.selCats)) st.selCats[c]=true; }); }
      renderChips(); renderList();
    }).catch(function(){ document.getElementById("list").innerHTML='<div class="empty">No se pudo cargar la lista. Reintentá en un momento.</div>'; });
  }

  document.querySelectorAll(".gate-btns button").forEach(function(b){ b.addEventListener("click", function(){ st.mode=b.dataset.mode; showApp(); load(); }); });
  document.querySelectorAll(".seg.who button").forEach(function(b){ b.addEventListener("click", function(){ var k=b.dataset.who; st.who[k]=!st.who[k]; if(!st.who.mayor&&!st.who.menor){ st.who[k]=true; } renderList(); }); });
  document.querySelectorAll(".seg.view button").forEach(function(b){ b.addEventListener("click", function(){ st.view=b.dataset.view; renderList(); }); });
  document.getElementById("q").addEventListener("input", function(e){ st.q=e.target.value; renderList(); });

  setInterval(function(){ if(document.getElementById("app").style.display==="block") load(); }, 5*60*1000);
})();
</script>
</body>
</html>
