<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light only" />
<title>Lista de precios — Pare Carrito</title>
<link rel="icon" type="image/png" href="./assets/favicon.png?v=20260723-sync" />
<style>
  :root{ --green:#176b49; --green2:#115c3e; --line:#e2e2e6; --ink:#16281f; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; }
  body{ font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--ink); background:#f4f7f5; }
  header{ background:linear-gradient(180deg,var(--green),var(--green2)); color:#eaf6f0; padding:18px 16px calc(16px + env(safe-area-inset-bottom,0)); }
  .wrap{ max-width:820px; margin:0 auto; padding:0 14px 40px; }
  .brand{ display:flex; align-items:center; gap:12px; max-width:820px; margin:0 auto; }
  .brand img{ width:40px; height:40px; border-radius:8px; background:#fff; padding:3px; }
  .brand h1{ font-size:19px; margin:0; }
  .brand small{ opacity:.85; font-size:12px; }
  /* Pantalla inicial */
  .gate{ min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; padding:20px; }
  .gate h2{ margin:0; font-size:22px; color:var(--green); }
  .gate p{ margin:0; color:#5a6b62; }
  .gate-btns{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px; }
  .gate-btns button{ font-size:18px; font-weight:700; padding:18px; border-radius:14px; border:2px solid var(--green); cursor:pointer; }
  .gate-btns .sin{ background:#fff; color:var(--green); }
  .gate-btns .con{ background:var(--green); color:#fff; }
  /* Lista */
  #app{ display:none; }
  .toolbar{ position:sticky; top:0; z-index:5; background:#f4f7f5; padding:10px 0 8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .search{ flex:1 1 180px; min-width:0; }
  .search input{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  .modeswitch{ display:inline-flex; border:1px solid var(--green); border-radius:10px; overflow:hidden; }
  .modeswitch button{ padding:10px 12px; border:0; background:#fff; color:var(--green); font-weight:700; cursor:pointer; font-size:13px; }
  .modeswitch button.active{ background:var(--green); color:#fff; }
  .meta{ font-size:12px; color:#5a6b62; margin:2px 0 8px; }
  table{ width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  th,td{ text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); }
  th{ background:#eaf6f0; color:var(--green); font-size:13px; position:sticky; top:56px; z-index:3; }
  td.price{ text-align:right; font-weight:700; white-space:nowrap; }
  td .unit{ color:#7a8a82; font-weight:400; font-size:12px; }
  tr:last-child td{ border-bottom:0; }
  .cat{ background:#f0f5f2; font-weight:700; color:var(--green); }
  .empty{ text-align:center; padding:30px; color:#7a8a82; }
  .foot{ text-align:center; color:#8a9992; font-size:12px; margin-top:16px; }
  .ivanote{ font-size:12px; color:#5a6b62; }
  @media (max-width:520px){ .brand h1{ font-size:17px; } th,td{ padding:10px; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="./assets/logo.png?v=20260723-sync" alt="Pare Carrito" onerror="this.style.display='none'" />
    <div><h1>Pare Carrito</h1><small>Insumos frescos para gastronómicos</small></div>
  </div>
</header>

<div class="wrap">
  <!-- Pantalla inicial: elegir modo -->
  <div class="gate" id="gate">
    <h2>Lista de precios</h2>
    <p>¿Cómo querés ver los precios?</p>
    <div class="gate-btns">
      <button class="sin" data-mode="sin">Ver precios SIN IVA</button>
      <button class="con" data-mode="con">Ver precios CON IVA</button>
    </div>
    <p class="ivanote">Con IVA: se suma el IVA de cada producto (10,5% se calcula al 12%).</p>
  </div>

  <!-- Lista -->
  <div id="app">
    <div class="toolbar">
      <div class="search"><input id="q" type="search" placeholder="Buscar producto..." autocomplete="off" /></div>
      <div class="modeswitch">
        <button data-set="sin">Sin IVA</button>
        <button data-set="con">Con IVA</button>
      </div>
    </div>
    <div class="meta" id="meta"></div>
    <div id="list"></div>
    <div class="foot">Los precios se actualizan automáticamente. www.parecarrito.com.ar</div>
  </div>
</div>

<script>
(function(){
  var API = "/api/public/price-list";
  var state = { items:[], updatedAt:null, mode:"sin", q:"" };

  function fmtMoney(n){
    n = Math.round(Number(n||0));
    return "$" + n.toLocaleString("es-AR");
  }
  function priceFor(it){
    if(state.mode === "con") return it.price * (1 + (Number(it.ivaSurcharge)||0)/100);
    return it.price;
  }
  function fmtDate(iso){
    if(!iso) return "";
    try{ var d=new Date(iso); return d.toLocaleDateString("es-AR")+" "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; }
  }
  function render(){
    var q = state.q.trim().toLowerCase();
    var items = state.items.filter(function(it){ return !q || it.name.toLowerCase().indexOf(q)!==-1; });
    var meta = document.getElementById("meta");
    meta.textContent = (state.mode==="con" ? "Precios CON IVA" : "Precios SIN IVA") +
      " · " + items.length + " productos" + (state.updatedAt ? " · actualizado " + fmtDate(state.updatedAt) : "");
    document.querySelectorAll(".modeswitch button").forEach(function(b){ b.classList.toggle("active", b.dataset.set===state.mode); });
    var list = document.getElementById("list");
    if(!items.length){ list.innerHTML = '<div class="empty">No hay productos para mostrar.</div>'; return; }
    var rows = items.map(function(it){
      var unit = it.unitType ? ' <span class="unit">('+esc(it.unitType)+')</span>' : "";
      return '<tr><td>'+esc(it.name)+unit+'</td><td class="price">'+fmtMoney(priceFor(it))+'</td></tr>';
    }).join("");
    list.innerHTML = '<table><thead><tr><th>Producto</th><th style="text-align:right">Precio</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

  function showApp(){ document.getElementById("gate").style.display="none"; document.getElementById("app").style.display="block"; }

  function load(){
    fetch(API, { cache:"no-store" }).then(function(r){ return r.json(); }).then(function(data){
      state.items = Array.isArray(data.items) ? data.items : [];
      state.updatedAt = data.updatedAt || null;
      render();
    }).catch(function(){
      document.getElementById("list").innerHTML = '<div class="empty">No se pudo cargar la lista. Reintentá en un momento.</div>';
    });
  }

  document.querySelectorAll(".gate-btns button").forEach(function(b){
    b.addEventListener("click", function(){ state.mode = b.dataset.mode; showApp(); render(); load(); });
  });
  document.querySelectorAll(".modeswitch button").forEach(function(b){
    b.addEventListener("click", function(){ state.mode = b.dataset.set; render(); });
  });
  document.getElementById("q").addEventListener("input", function(e){ state.q = e.target.value; render(); });

  // Auto-refresh cada 5 minutos mientras la pagina esta abierta.
  setInterval(function(){ if(document.getElementById("app").style.display==="block") load(); }, 5*60*1000);
})();
</script>
</body>
</html>
