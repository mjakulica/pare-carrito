services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: parecarrito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: parecarrito
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parecarrito -d parecarrito"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://parecarrito:${POSTGRES_PASSWORD}@db:5432/parecarrito
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-gerente}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-gerente123}
      UPLOAD_DIR: /data/uploads
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-}
      GOOGLE_SHEETS_WEBHOOK_URL: ${GOOGLE_SHEETS_WEBHOOK_URL:-}
      GOOGLE_SHEETS_TOKEN: ${GOOGLE_SHEETS_TOKEN:-}
      BOT_BROADCAST_URL: ${BOT_BROADCAST_URL:-http://whatsapp-bot:8090/broadcast}
      BROADCAST_KEY: ${BROADCAST_KEY:-}
      TUSFACTURAS_APIKEY: ${TUSFACTURAS_APIKEY:-}
      TUSFACTURAS_APITOKEN: ${TUSFACTURAS_APITOKEN:-}
      TUSFACTURAS_USERTOKEN: ${TUSFACTURAS_USERTOKEN:-}
      TUSFACTURAS_PUNTO_VENTA: ${TUSFACTURAS_PUNTO_VENTA:-1}
      TUSFACTURAS_PROVINCIA: ${TUSFACTURAS_PROVINCIA:-17}
      TUSFACTURAS_RUBRO: ${TUSFACTURAS_RUBRO:-Frutas y verduras}
      TUSFACTURAS_CONDICION_PAGO: ${TUSFACTURAS_CONDICION_PAGO:-211}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      MOONSHOT_API_URL: ${MOONSHOT_API_URL:-https://api.moonshot.ai/v1/chat/completions}
      MOONSHOT_MODEL: ${MOONSHOT_MODEL:-kimi-k2.7}
      MOONSHOT_VISION_MODEL: ${MOONSHOT_VISION_MODEL:-moonshot-v1-32k-vision-preview}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL:-https://openrouter.ai/api/v1/chat/completions}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-openai/gpt-4o-mini}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      GOOGLE_VISION_URL: ${GOOGLE_VISION_URL:-https://vision.googleapis.com/v1/images:annotate}
      GOOGLE_VISION_LANG: ${GOOGLE_VISION_LANG:-es-t-i0-handwrit}
    volumes:
      - uploads:/data/uploads

  whatsapp-bot:
    build: ../whatsapp-bot
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 8090
      TZ: ${TZ:-America/Argentina/Salta}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-pare-carrito-webhook}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      NOTIFY_NUMBERS: ${NOTIFY_NUMBERS:-}
      OWNER_NUMBER: ${OWNER_NUMBER:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL:-https://openrouter.ai/api/v1/chat/completions}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      # El bot le habla a la API por la red interna de Docker (no pasa por Caddy):
      ERP_BASE_URL: ${WABOT_ERP_BASE_URL:-http://api:3000}
      ERP_API_KEY: ${EXTERNAL_API_KEY:-}
      ADD_DIRECT_BEFORE: ${ADD_DIRECT_BEFORE:-05:30}
      ADD_CONFIRM1_UNTIL: ${ADD_CONFIRM1_UNTIL:-07:30}
      ADD_CONFIRM2_UNTIL: ${ADD_CONFIRM2_UNTIL:-10:00}
      BROADCAST_KEY: ${BROADCAST_KEY:-}
    volumes:
      - wabot_data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../lucas-pare-carrito-erp:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  wabot_data:
